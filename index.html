<!doctype html>
<!--
  GitHub Pages(github.io)용 카메라 페이지 진입점.

  static/camera/index.html(1번 담당)은 수정하지 않고, 같은 화면을 루트에서 연다.
  - CSS/JS는 상대경로로 불러온다 (github.io/<repo>/ 하위에서도 동작하도록)
  - github.io에는 FastAPI 서버가 없으므로, camera.js가 보내는 "/frame" 요청을
    URL의 ?api= 서버 주소로 보낸다.

  접속 예:
    https://david-laugh.github.io/Real-time-OCR-Pipeline/?session=abc123&api=https://xxxx.trycloudflare.com

  ※ static/camera/index.html의 마크업(id)이 바뀌면 아래 <body>도 같이 맞춰야 한다.
  ※ 서버(FastAPI)에서 github.io origin에 대한 CORS 허용이 필요하다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>카메라 촬영</title>
  <link rel="stylesheet" href="static/camera/camera.css">
</head>
<body>
  <div class="app">
    <section class="preview">
      <video id="video" playsinline muted autoplay></video>
      <p id="placeholder" class="placeholder">시작 버튼을 누르면 카메라가 켜져요</p>
      <p class="landscape-hint">세로로 들면 더 잘 인식돼요</p>
    </section>

    <section class="panel">
      <header class="panel-head">
        <span id="status" class="status" data-state="idle">대기</span>
        <span id="session" class="session"></span>
      </header>

      <div id="api-missing" class="notice notice-error" hidden>
        <p class="notice-title">서버 주소가 없어요</p>
        <p>QR 코드의 주소로 다시 열어 주세요. (주소에 <b>api=https://…</b>가 있어야 해요)</p>
      </div>

      <div id="inapp" class="notice" hidden>
        <p><strong>앱 안의 브라우저에서 열렸어요.</strong><br>
          카메라가 동작하지 않을 수 있어요. 메뉴(⋮ 또는 공유 버튼)에서
          <b>Safari로 열기</b> / <b>다른 브라우저로 열기</b>를 선택하거나,
          주소를 복사해 Safari·Chrome에 붙여넣어 주세요.</p>
        <button id="copy-url" type="button" class="btn btn-small">주소 복사</button>
      </div>

      <div id="error" class="notice notice-error" hidden>
        <p id="error-title" class="notice-title"></p>
        <p id="error-message"></p>
        <ol id="error-steps"></ol>
        <button id="retry" type="button" class="btn btn-small">다시 시도</button>
      </div>

      <div class="controls">
        <button id="start" type="button" class="btn btn-primary">시작</button>
        <button id="stop" type="button" class="btn" disabled>정지</button>
      </div>

      <p id="stats" class="stats"></p>
    </section>
  </div>

  <script>
    // camera.js보다 먼저 실행: "/frame" 같은 절대경로 요청을 ?api= 서버로 보낸다.
    (function () {
      var raw = new URLSearchParams(location.search).get("api") || "";
      var apiBase = /^https:\/\/[^\s/]+/.test(raw) ? raw.replace(/\/+$/, "") : "";
      if (!apiBase) {
        document.getElementById("api-missing").hidden = false;
        return;
      }
      var originalFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        if (typeof input === "string" && input.charAt(0) === "/") {
          input = apiBase + input;
        }
        return originalFetch(input, init);
      };
    })();
  </script>
  <script src="static/camera/camera.js"></script>
</body>
</html>
